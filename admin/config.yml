# decap cms, on decap turbo. saves are commits to the repo, the build reads them from content

backend:
  name: turbo-github # the kind of backend, always this for turbo. the site itself is picked by the id below
  turbo_site_id: a936ba87-35da-4627-a2a1-48b405e634d0 # the id on the site's overview tab in turbo
  branch: main

# saving keeps a change as a draft on a branch of its own, and it only reaches the site once it is
# published from the workflow tab. this is the part being tested
publish_mode: editorial_workflow

media_folder: uploads
public_folder: /uploads

collections:
  # a folder collection: one json file per entry, like the catalog and events
  - name: entries
    label: Entries
    label_singular: Entry
    folder: content/entries
    create: true
    extension: json
    format: json
    slug: "{{slug}}"
    identifier_field: Title
    summary: "{{Title}} ({{Date}})"
    fields:
      - {label: Title, name: Title, widget: string}
      - {label: Date, name: Date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false}
      - {label: Image, name: Image, widget: image, required: false}
      - {label: Body, name: Body, widget: markdown, modes: [rich_text], buttons: [link], editor_components: [figure]}

  # a files collection: one fixed page, like the about page
  - name: pages
    label: Pages
    files:
      - label: About page
        name: about
        file: content/about.json
        fields:
          - {label: Title, name: Title, widget: string}
          - {label: Body, name: Body, widget: markdown, modes: [rich_text], buttons: [link], editor_components: []}
